[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgsp-toolkit"
version = "0.1.0"
description = "Loss-compensated remote graph-state preparation and multi-client phase programming"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Jiawei Cai"}]
dependencies = ["numpy>=1.24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/Teresa11111111111/RGSP_toolkit"

[project.scripts]
rgsp = "rgsp_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
